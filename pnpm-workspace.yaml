packages:
  - "."

catalogs: {}

auditConfig:
  ignoreCves: []

# Reject packages published less than 7 days ago to reduce supply-chain attack risk.
# Value is in minutes: 7 days × 24 h × 60 min = 10080
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
  # Renovate security update: happy-dom@21.0.4
  - happy-dom@21.0.4
  # Renovate security update: astro@7.4.7
  - astro@7.4.7

# pnpm 11 fails on unreviewed build scripts. esbuild ships its binary via optional
# platform packages, so its postinstall stays disabled as it was under pnpm 10. workerd's postinstall
# checks the runtime binary that wrangler dev serves the tests with, so it runs.
allowBuilds:
  esbuild: false
  workerd: true

# pnpm 11 links packages from a global virtual store by default outside CI. Astro's container
# API then cannot resolve @astrojs/react from inside the store, so the page tests fail locally;
# keep the project-local store that CI already uses.
enableGlobalVirtualStore: false
